name: Arduino CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install AVR core (Arduino Uno)
        run: arduino-cli core update-index && arduino-cli core install arduino:avr

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            --export-binaries \
            examples

      - name: List compiled files
        run: find . -type f -name "*.hex" -o -name "*.elf"

      - name: Upload compiled .hex as artifact
        uses: actions/upload-artifact@v4
        with:
          name: arduino-hex
          path: |
            **/*.hex
